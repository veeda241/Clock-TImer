<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact AI Thon</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="grainient-canvas"></canvas>
    <div class="overlay"></div>

    <div class="ui-container">

        <!-- Header -->
        <header class="glass-header">
            <div class="brand-strip">
                <img src="Engg Logo1.png" alt="St. Joseph's" class="college-logo">
                <div class="brand-text">
                    <div class="subtitle">ST. JOSEPH'S COLLEGE OF ENGINEERING</div>
                    <div class="sub-subtitle">DEPT. OF ARTIFICIAL INTELLIGENCE & DATA SCIENCE</div>
                </div>
                <img src="ads-removebg-preview.png" alt="ADS" class="dept-logo">
            </div>

            <div class="event-title-wrapper">
                <div class="glitch-wrapper">
                    <h1 class="hero-title" id="hackathon-title" data-text="Impact AI Thon">Impact AI Thon</h1>
                </div>
                <img src="/logo.jpeg" alt="Event Logo" class="event-logo" id="logo">
            </div>
        </header>

        <!-- Main Timer -->
        <div id="live-indicator" class="status-pill pulse-green">
            <span class="dot"></span>
            <span class="status-text">SYSTEM ONLINE</span>
        </div>

        <div id="timer-container" class="timer-grid">
            <!-- Hours -->
            <div class="timer-card">
                <div class="ring-container">
                    <svg class="progress-ring" width="220" height="220">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.05)" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                        <circle id="ring-hours" class="progress-ring__circle" stroke="#b388ff" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                    </svg>
                    <div class="time-value-wrapper">
                        <span id="hours">00</span>
                        <span class="label">HOURS</span>
                    </div>
                </div>
            </div>

            <div class="separator">:</div>

            <!-- Minutes -->
            <div class="timer-card">
                <div class="ring-container">
                    <svg class="progress-ring" width="220" height="220">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.05)" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                        <circle id="ring-minutes" class="progress-ring__circle" stroke="#00e5ff" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                    </svg>
                    <div class="time-value-wrapper">
                        <span id="minutes">00</span>
                        <span class="label">MINUTES</span>
                    </div>
                </div>
            </div>

            <div class="separator">:</div>

            <!-- Seconds -->
            <div class="timer-card">
                <div class="ring-container">
                    <svg class="progress-ring" width="220" height="220">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.05)" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                        <circle id="ring-seconds" class="progress-ring__circle" stroke="#ff4081" stroke-width="6"
                            fill="transparent" r="90" cx="110" cy="110" />
                    </svg>
                    <div class="time-value-wrapper">
                        <span id="seconds">00</span>
                        <span class="label">SECONDS</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="times-up-display" class="hidden">
            <h2 class="glitch" data-text="TIME EXPIRED">TIME EXPIRED</h2>
        </div>
        </main>

        <!-- Footer / Status -->
        <footer class="system-footer">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
                <div class="progress-glow"></div>
            </div>
            <div class="footer-grid">
                <div class="stats-box">
                    <span class="stat-label">COMPLETION</span>
                    <span class="stat-value" id="progress-percentage">0%</span>
                </div>
                <div class="terminal-box">
                    <div id="terminal-line" class="typewriter"></div>
                </div>
            </div>
        </footer>

    </div>

    <!-- Hidden Audio -->
    <audio id="background-music" src="HackAIThon Anthem.mp3" loop></audio>
    <audio id="final-15-music" src="(Audio) 15 Minutes of YouTube Cinematic Premiere countdown.m4a"></audio>
    <button id="mute-btn" class="floating-mute">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path
                d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
    </button>

    <script src="grainient.js"></script>
    <script src="timer.js"></script>
</body>

</html>
